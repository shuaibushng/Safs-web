<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102329">
  <title>Sign in | Safs Electrical installation</title>
  <style>
    :root {
      --ink: #142126;
      --muted: #607076;
      --paper: #f6f5f0;
      --lime: #d9f36a;
      --line: #dfe3dd;
      --navy: #102329;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1160px, calc(100% - 48px)); margin: auto; }
    header { height: 82px; border-bottom: 1px solid var(--line); }
    .nav { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 800; letter-spacing: -.04em; }
    .mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--lime); font-size: 19px; }
    .back { color: #46575c; font-size: 13px; font-weight: 700; }
    main { min-height: calc(100vh - 82px); display: grid; place-items: center; padding: 58px 24px; }
    .login { width: min(100%, 460px); padding: 44px 48px; border: 1px solid #e7e9e4; background: white; box-shadow: 0 18px 60px rgba(16,35,41,.06); }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: #586a6e; font-size: 11px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    .eyebrow::before { width: 25px; height: 2px; background: #9bb629; content: ""; }
    h1 { margin: 17px 0 9px; font: 400 44px/1.05 var(--serif); letter-spacing: -.045em; }
    .intro { margin: 0 0 28px; color: var(--muted); font-size: 14px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 700; }
    .field input { width: 100%; height: 48px; padding: 0 13px; border: 1px solid #cfd7d2; border-radius: 3px; font: 14px var(--sans); }
    .field input:focus { outline: 2px solid #9bb629; outline-offset: 1px; }
    .password-head { display: flex; align-items: center; justify-content: space-between; }
    .password-head a { color: #56686b; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
    .submit { width: 100%; height: 50px; margin-top: 5px; border: 0; border-radius: 3px; background: var(--navy); color: white; font-size: 14px; font-weight: 700; cursor: pointer; }
    .note { margin: 19px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    .note a { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
    .status { min-height: 20px; margin: 12px 0 0; color: #8a431c; font-size: 12px; text-align: center; }
    @media (max-width: 560px) {
      header { height: 70px; }
      .wrap { width: calc(100% - 36px); }
      main { min-height: calc(100vh - 70px); padding: 32px 18px; }
      .login { padding: 34px 25px; }
      h1 { font-size: 39px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand"><span class="mark">ϟ</span> Safs Electrical installation</a>
    </div>
  </header>

  <main>
    <section class="login" aria-labelledby="login-title">
      <div class="eyebrow">Customer account</div>
      <h1 id="login-title">Welcome back.</h1>
      <p class="intro">Sign in to your account.!</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <div class="password-head">
            <label for="password">Password</label>
            
          </div>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        </div>
        <button class="submit" type="submit">Sign in ↗</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
      <p class="note">Need an account? <a href="mailto:hello@brightline.example?subject=Account%20request">Sign Up!</a></p>
      <hr>
      <p><a href="mailto:hello@brightline.example?subject=Password%20help">Forgot password?</a></p>
    </section>
  </main>

  <script>
    // Connect this form to an authentication service to enable real sign-in.
    document.getElementById("login-form").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("status").textContent = "Wrong Email or Password!";
    });
  </script>
</body>
</html>
